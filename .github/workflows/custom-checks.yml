name: Custom checks

on:
  push:
    branches: [custom-main]
  pull_request:
    branches: [custom-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize dashboard source
        shell: pwsh
        run: |
          $dashboardCommit = git ls-tree HEAD dashboard | ForEach-Object { ($_ -split '\s+')[2] }
          git clone https://github.com/mxh110708/may-route-dashboard.git dashboard
          git -C dashboard checkout $dashboardCommit
          git -C dashboard submodule update --init --recursive
      - name: Initialize core source
        shell: pwsh
        run: |
          $coreRevision = (Get-Content version.json -Raw | ConvertFrom-Json).version
          git clone --depth 1 --branch "v$coreRevision" https://github.com/SagerNet/sing-box.git ../sing-box
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C dashboard install --frozen-lockfile
      - run: pnpm -C dashboard generate
      - run: pnpm generate
      - run: pnpm test:update-source
      - run: pnpm test:runtime-config
      - run: pnpm test:rpc-limits
      - run: pnpm test:public-rules
      - run: pnpm test:interface-fonts
      - run: pnpm test:tray-placement
      - run: pnpm test:tray-activation
      - run: pnpm test:tray-menu
      - run: pnpm test:background-idle
      - run: pnpm test:renderer-loading
      - run: pnpm test:localization
      - run: pnpm test:system-proxy-recovery
      - run: pnpm test:priority-editor:electron
      - run: pnpm test:installer-preflight
      - run: pnpm test:installer-shortcuts
      - run: pnpm test:installer-shortcut-host
      - run: pnpm test:installer-storage
      - run: pnpm typecheck
      - run: pnpm -C dashboard test -- --run
      - run: pnpm -C dashboard lint
      - run: pnpm -C dashboard lint:css

      # The isolation test also reads the sibling custom core checkout, so it
      # runs locally before every signed package instead of in this test-only CI.
